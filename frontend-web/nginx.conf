# Nginx da imagem do site (frontend-web/Dockerfile → /etc/nginx/conf.d/default.conf, dentro do bloco http).
# Uma só origem para o navegador (http://localhost:8080 no docker-compose.yml):
#   /            → build do SPA (frontend-web/dist), com fallback para index.html nas rotas do React
#   /api/...     → API (container "api", porta 3000) SEM o prefixo: /api/health → /health
#   /uploads/... → imagens enviadas, servidas pela API (o site usa /api/uploads/...; este caminho cobre
#                  endereços antigos ou montados sem o prefixo)
# Guia: docs/saas/docker.md

# Caminho pedido à API: o URI ORIGINAL (codificação e query string intactas) sem o prefixo /api
map $request_uri $comestra_api_path {
    "~^/api(?<comestra_api_rest>/.*)$" $comestra_api_rest;
    default /;
}

# Links de uso único levam o token NO CAMINHO: redefinição de senha, convite (inclusive o de troca do responsável)
# e confirmação/troca/desfazer de e-mail, nas páginas do site e nas rotas da API que eles chamam. O banco guarda só
# o SHA-256 desses tokens; o log de acesso também não pode guardá-los (quem lê os logs resgataria o link). Mantenha
# a lista igual às rotas com :token de frontend-web/src/routes/index.tsx e dos controllers da API.
map $request_uri $comestra_log_uri {
    "~*^(?<comestra_log_path>/+(?:api/+)?(?:redefinir-senha|convite|verificar-email|confirmar-email|desfazer-troca-de-email|auth/+reset-password|invitations|account/+(?:email-change|email-revert|email-verification)))/+(?!confirm(?:[/?#]|$))[^/?#]+(?<comestra_log_rest>.*)$" "${comestra_log_path}/[redacted]${comestra_log_rest}";
    default $request_uri;
}

# O Referer das requisições feitas a partir dessas páginas (arquivos do site e chamadas à API, mesma origem) leva o
# endereço da página, com o token: no log, só a origem e o caminho até o token.
map $http_referer $comestra_log_referer {
    "~*^(?<comestra_ref_page>[a-z][a-z0-9+.-]*://[^/?#]+/+(?:api/+)?(?:redefinir-senha|convite|verificar-email|confirmar-email|desfazer-troca-de-email|auth/+reset-password|invitations|account/+(?:email-change|email-revert|email-verification)))/+(?!confirm(?:[/?#]|$))[^/?#]+" "${comestra_ref_page}/[redacted]";
    default $http_referer;
}

# Log de acesso SEM cabeçalhos de credencial: nunca registra Cookie, Set-Cookie nem Authorization. O refresh da
# sessão do site vai num cookie com Path=/ em TODA requisição a este host (inclusive aos arquivos do site), então
# o formato é explícito aqui em vez de depender do "main" da imagem base. Mesmos campos do "main" (sem $remote_user),
# com o caminho e o Referer sem os tokens dos links de uso único ($comestra_log_uri e $comestra_log_referer).
log_format comestra '$remote_addr - [$time_local] "$request_method $comestra_log_uri $server_protocol" '
                    '$status $body_bytes_sent "$comestra_log_referer" "$http_user_agent" "$http_x_forwarded_for"';

# Sem registrar no log de acesso o healthcheck do próprio container (wget em 127.0.0.1 a cada 10 s)
map $remote_addr $comestra_access_log {
    127.0.0.1 0;
    default   1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log comestra if=$comestra_access_log;
    # Redirecionamentos do Nginx com caminho relativo (a porta publicada no host não é a 80 do container)
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Imagens de até 5 MB na API (MAX_IMAGE_SIZE_MB), com folga para o multipart
    client_max_body_size 12m;

    # DNS interno do Docker: o IP do container da API é consultado de novo a cada 10 s, então um
    # "docker compose restart api" (ou um container recriado com outro IP) não deixa o Nginx apontando
    # para o endereço antigo. Com variável no proxy_pass, o Nginx também sobe sem a API no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $comestra_api_upstream api:3000;

    # Cabeçalhos repassados à API. A API confia em UM salto (TRUST_PROXY=1): vale o último endereço do
    # X-Forwarded-For, o que este Nginx acrescenta ($remote_addr). O cliente não consegue forjar o próprio IP.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Compressão só dos arquivos do site (as respostas da API não são comprimidas aqui)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # --- API -------------------------------------------------------------------------------------
    location /api/ {
        gzip off;
        proxy_pass http://$comestra_api_upstream$comestra_api_path;
    }

    location /uploads/ {
        gzip off;
        proxy_pass http://$comestra_api_upstream$request_uri;
    }

    # --- SPA -------------------------------------------------------------------------------------
    # Arquivos do build com hash no nome: cache longo (um build novo gera nomes novos).
    # Arquivo inexistente → 404 (nunca o index.html no lugar de um .js).
    location /assets/ {
        include /etc/nginx/snippets/comestra-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (e as rotas do SPA, que caem nele) sempre revalidado: depois de um deploy o navegador
    # busca o index novo, que aponta para os assets novos.
    location = /index.html {
        include /etc/nginx/snippets/comestra-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/comestra-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
