# Comestra SaaS em containers: banco (PostgreSQL 18), API (NestJS) e site (Nginx com o SPA + proxy da API).
#
#   1. Crie o .env.docker a partir do .env.docker.example (segredos fortes; o arquivo é ignorado pelo Git).
#   2. docker compose up -d --build
#   3. Abra http://localhost:8080   (API em http://localhost:8080/api, ex.: /api/health)
#
# O navegador fala só com o Nginx (serviço "web"): a API e o banco não têm porta publicada no computador.
# Dados em volumes nomeados (banco: comestra_db-data · imagens enviadas: comestra_uploads), preservados por
# "docker compose down" (só "down -v" os apaga). Guia completo: docs/saas/docker.md
#
# Porta e interface no computador: COMESTRA_HTTP_PORT (padrão 8080) e COMESTRA_HTTP_BIND (padrão 127.0.0.1,
# só esta máquina), lidas do ambiente do terminal. Mudou a porta? Ajuste APP_WEB_URL, CORS_ORIGINS e
# PUBLIC_API_URL no .env.docker.

name: comestra

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # POSTGRES_PASSWORD vem do .env.docker. A senha só é gravada na CRIAÇÃO do volume: trocar o valor depois
    # não muda a senha do banco (veja "Trocar a senha do banco" no guia).
    env_file: .env.docker
    environment:
      POSTGRES_USER: comestra
      POSTGRES_DB: comestra
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      # PostgreSQL 18+: o volume vai em /var/lib/postgresql (os dados ficam em 18/docker dentro dele)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    # Sem porta no computador. Para depurar com um cliente local, crie um docker-compose.override.yml com
    #   services: { db: { ports: ["127.0.0.1:55432:5432"] } }
    logging: *logging

  api:
    build:
      context: ./backend
    image: comestra-api:local
    restart: unless-stopped
    # Processo init (tini): repassa o SIGTERM do "docker compose stop" ao Node e recolhe processos filhos
    init: true
    env_file: .env.docker
    # Valores fixos desta composição (têm prioridade sobre o .env.docker)
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: comestra
      DB_DATABASE: comestra
      # Schema só pelas migrations, aplicadas na subida (uma instância da API)
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Primeira subida: aplica todas as migrations antes de escutar
      start_period: 90s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - edge
    logging: *logging

  web:
    build:
      context: ./frontend-web
      args:
        # Relativo = mesma origem do site (o Nginx encaminha /api/ para a API)
        VITE_API_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME:-}
    image: comestra-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${COMESTRA_HTTP_BIND:-127.0.0.1}:${COMESTRA_HTTP_PORT:-8080}:80"
    # O processo mestre do Nginx roda como root só para abrir a porta 80, criar as pastas temporárias
    # (/var/cache/nginx, entregues ao usuário "nginx") e passar os workers para esse usuário. Nenhuma outra
    # capacidade do kernel (sem DAC_OVERRIDE, NET_RAW, MKNOD, SYS_CHROOT, SETFCAP, KILL...). Sem DAC_OVERRIDE o
    # mestre (root) só mexe no que é dele; os workers gravam o corpo dos uploads em /var/cache/nginx/*_temp, que
    # são do usuário "nginx" (conferido: subida, upload grande pelo proxy, nginx -s reload e restart).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *logging

volumes:
  db-data:
  uploads:

networks:
  # Banco e API. Sem saída para a internet nem acesso do computador.
  internal:
    internal: true
  # Site e API: a API sai por aqui para a internet (CEP, Mercado Pago, SMTP).
  edge:
